name: CI

on:
  push:
    branches: [dev, main]
    # Documentation is deliberately NOT ignored here. It used to be
    # ('**/*.md' + 'docs/**'), which meant a docs-only change produced no
    # workflow run at all — not a reduced one, none — so nothing ever
    # verified it. '.git-blame-ignore-revs' stays ignored: it is not
    # documentation and CI has no reason to run on a change touching only it.
    paths-ignore:
      - '.git-blame-ignore-revs'
  pull_request:
    branches: [dev, main]
    paths-ignore:
      - '.git-blame-ignore-revs'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Backend deploy-gating tests resolve real ancestry (git rev-parse
          # HEAD~3); the default shallow fetch-depth of 1 makes that fail.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck frontend
        run: npx tsc --noEmit -p packages/frontend/tsconfig.json

      - name: Typecheck backend
        run: npx tsc --noEmit -p packages/backend/tsconfig.json

      - name: Test frontend
        run: npm run test -w packages/frontend

      - name: Test backend
        run: npm run test -w packages/backend

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Check markdown paths
        # Validates that repo-relative paths referenced in tracked markdown
        # resolve to tracked files, so a rename/delete cannot silently leave
        # documentation pointing at nothing. Needs the full checkout the
        # fetch-depth: 0 above already provides — the checker enumerates the
        # tree with `git ls-files`. Exclusions (deployed/generated paths) and
        # the `path-check:ignore` line marker live in the script itself.
        run: npm run check:markdown-paths

      - name: Verify systemd unit
        run: |
          # systemd-analyze verify resolves ExecStart's binary and fails if it is
          # missing. The unit targets /usr/bin/node (the NodeSource path on the
          # production host), but actions/setup-node installs node under the runner
          # toolcache, so /usr/bin/node is absent on CI. Symlink it so verify can
          # validate the canonical unit without weakening it for production.
          sudo ln -sf "$(command -v node)" /usr/bin/node
          systemd-analyze verify installers/linux/orchestrator.service
