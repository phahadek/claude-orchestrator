# Per-project orchestrator config. Read by packages/backend/src/session/orchestrator-config.ts.
# Silent no-op if missing; defaults are empty arrays / empty string.

# Structured test-result contract: format of the test report(s) produced by the
# `test:` commands below, and a glob (relative to project root) locating them.
# Both frontend and backend `npm run test -w ...` scripts now pass
# --reporter=junit --outputFile=.test-reports/<pkg>.xml to vitest.
test_report_format: junit-xml
test_report_glob: '**/.test-reports/*.xml'

# Commands the orchestrator runs in the worktree after PR open, before review spawn.
# Mechanical fixes only — failures are logged and review proceeds.
autofix:
  - npm run format:write
  - npm run lint:fix

# Commands the session runs as a fast-fail before pushing. Injected into the
# orchestrator-generated CLAUDE.md Pre-PR Gate section.
verify:
  - npx tsc --noEmit -p packages/frontend/tsconfig.json
  - npx tsc --noEmit -p packages/backend/tsconfig.json
  - npm run build

# GitHub check-run names treated as authoritative for pass/fail mergeability.
# Single job in .github/workflows/build.yml is named "build".
ci_check_name:
  - build

# Whether orchestrator autofix / file-revert commits carry [skip ci].
# This repo has a *required* "build" status check (above): a [skip ci] commit
# skips the pull_request workflow, so the required check never reports on the
# new head SHA and the PR's required check stays starved forever. Set false so
# autofix/revert pushes still trigger the build and the required check resolves.
autofix_skip_ci: false

# Commands the orchestrator runs as authoritative tests per head-SHA.
# Empty list = feature off (no-op). Each command is run with a per-command timeout.
# Two separate entries (matching CI's two "Test frontend"/"Test backend" steps)
# so test_fail_fast stops at the first failing workspace and names it, same as CI.
test:
  - npm run test -w packages/frontend
  - npm run test -w packages/backend

# Per-command timeout in seconds for test commands. Default 300 (5 min).
# Raised 300 -> 900 on 2026-08-23: the backend suite's own measured test time
# (test_run_summaries.total_duration_ms) grew 188s -> 359s between 08-19 and
# 08-23 (+91%) while its test count grew only +3.6%, and wall-clock execution
# p50 reached 4.9 min against the 5 min budget (p90 8.5 min). Runs began
# timing out on 08-23 (10 timeouts, 0 passes in 34 runs; 0 timeouts on 08-22),
# and every timeout leaves orphaned vitest workers behind (see the test-lane
# teardown task), so crossing this threshold is self-reinforcing rather than
# self-limiting. 900 restores roughly the 3x headroom-over-p50 this value had
# when it was set. This is a stopgap: the suite's cost trend is the real
# problem and needs its own fix.
test_timeout_sec: 900

# Diff-scoped alternative to `test:` above, run instead of it when a
# test.request's diff touches none of `test_full_run_paths` below. May
# contain {{changed_files}}, expanded the same way autofix commands are.
# Empty (default, unset here) = feature off — `test:` always runs in full.
test_scoped: []

# Glob list forcing the full `test:` command instead of `test_scoped` when
# the diff touches any of them (shared config/infra a scoped run can't
# safely skip). Ignored while `test_scoped` is empty.
test_full_run_paths: []

# Commands the orchestrator runs on each PR before spawning review — catches lint errors, license contamination, and secret leaks.
# Phase 1 baseline: eslint errors + GPL/AGPL dependency check. Warnings tolerated (11-warning baseline on dev).
# Phase 4: gitleaks secret scanning — git-aware mode auto-respects .gitignore; allowlist in .gitleaks.toml.
# Phase 6: knip unused-export / dead-code gate — knip.json silences false positives (gitignored dirs, scripts, test helpers).
# Phase 7: npm audit vulnerability gate — high threshold, prod deps only (--omit=dev).
analyze:
  - npm run lint
  - npm run audit:licenses
  - gitleaks dir .
  - npx knip --no-progress --reporter compact
  - npm audit --audit-level=high --omit=dev

# Timeout in seconds for the analyze phase.
analyze_timeout_sec: 180

# Maximum RSS in MB for the analyze phase.
analyze_max_rss_mb: 2048

# Extra Bash tool permission patterns merged with the base allowed-tools set.
allowed_tools: []

# Extra Bash rule text injected into the session-facing CLAUDE.md.
bash_rules: []

# Path (relative to project root) to a script run after worktree creation, before session spawn.
bootstrap_script: ''

# Session-kind-keyed capability pre-grants, seeded into a session's
# granted_capabilities at spawn time (see capability_pre_grants in
# packages/backend/src/session/orchestrator-config.ts) so a session starts
# already holding reads this project always intends to grant, with no
# session.requestCapability round trip needed. Keys must be members of
# PRE_GRANT_SESSION_KINDS; project-scoped capability strings use the
# registry project id `claude-dashboard`, not the config-dir name
# `claude-orchestrator`. Scoped to observed per-kind demand (measured
# 2026-08-20) rather than seeded uniformly across all six kinds:
# - gate-verify / investigate: read:audit-log + read:session-events, plus
#   the read-only adhoc-query script (isGrantable — matches no denylist
#   pattern; read-only enforced independently by the script itself).
# - investigate also gets a static read:path: grant onto the backend-owned
#   investigation-report-images storage root (reportStore.ts#getReportImagesDir)
#   so a dispatched batch session can Read the `- image:` path
#   buildInvestigateProcedure lists per report, with no per-dispatch scratch
#   copy and no session.requestCapability round trip.
# - groom: read:audit-log + read:session-events — the carve-out that
#   auto-approves these reads for other kinds excludes groom
#   (isSanctionedAutoApproveCapability's nonGroomCarveOut), so groom's
#   requests otherwise park for a human every time.
# - ops: read:audit-log only — no observed read:session-events demand.
# design/docs are not seeded: design's demand is low and docs has none.
# This project's own sanctioned read-only ad hoc DB query command — the
# capability string a dispatched ops/gate-verify/investigate/deploy-step
# session requests through session.requestCapability for a DB table with no
# dedicated MCP read tool. Rendered by
# packages/backend/src/planning/procedureAssembler.ts#renderAdHocReadCapability
# into every such session's injected "Capabilities" section. Declared here
# (rather than a code-level default) so this repo's own behaviour is
# preserved by configuration, the same as every other managed project.
ad_hoc_read_command: 'Bash(npx ts-node packages/backend/scripts/adhoc-query.ts:*)'

capability_pre_grants:
  gate-verify:
    - read:audit-log:claude-dashboard
    - read:session-events:claude-dashboard
    - 'Bash(npx ts-node packages/backend/scripts/adhoc-query.ts:*)'
  investigate:
    - read:audit-log:claude-dashboard
    - read:session-events:claude-dashboard
    - 'Bash(npx ts-node packages/backend/scripts/adhoc-query.ts:*)'
    - 'read:path:/home/paulie/.local/share/claude-orchestrator/investigation-report-images'
  ops:
    - read:audit-log:claude-dashboard
  groom:
    - read:audit-log:claude-dashboard
    - read:session-events:claude-dashboard
