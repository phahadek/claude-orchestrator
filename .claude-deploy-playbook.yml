# Structured deploy playbook for the claude-orchestrator repo.
# Read by loadDeployPlaybook() and validated against playbookSchema.ts.
#
# The engine runs `shell`/`validation`/`confirm-gate` steps' command_or_prompt
# (and validation's poll_until) verbatim as shell commands — it performs no
# variable substitution of its own for those kinds; instead, host bindings
# declared in config/projects/claude-orchestrator/deploy-bindings.yml (see
# loadDeployBindings.ts) are injected as environment variables, so `bash -uc`
# (nounset) expands them natively and aborts on an undefined one. Absolute
# paths that vary per host — the runtime sync destination ($RUNTIME_DIR) and
# the DEPLOYED_SHA marker location ($DEPLOYED_SHA_PATH) — live in that
# bindings file rather than literally in the steps below. The orchestrator.service
# unit name and the verify port are not paths and stay embedded directly, per
# the migration's scope.
#
# `restart`'s identity_capture is re-read by `verify` on every poll attempt:
# the engine requires that reading to equal this run's own target_sha (not
# merely differ from some pre-restart baseline) plus a healthy response
# before `verify` can green — otherwise verify would report a healthy
# service that's serving the wrong build (an unrelated manual restart, a
# rollback, systemd's own retry landing on the outgoing build) as this run's
# success. `verify` is also bounded by a wall-clock timeout (engine-side,
# default 10 minutes, timed from its own first step_started event) so a
# crash-looping build can no longer leave a run stuck in `verify` forever.
#
# Rollback model: `rollback_ref` is author-declared per step, not a generic
# "restore prior state" the engine improvises. A step's forward-chain
# predecessor is NOT a compensating action (re-running `git fetch` doesn't
# undo `npm ci`), so no step below declares one — an unhandled failure halts
# and surfaces its failure_diagnoses entry instead. `sync-runtime` and
# `restart` specifically have no compensating step because this project runs
# forward-only DB migrations on boot: a generic "sync back + restart" would
# leave the schema ahead of a reverted build, so the correct response is
# operator-guided (surfaced via failure_diagnoses), not an automatic action.

steps:
  - id: fetch
    kind: shell
    command_or_prompt: 'git fetch origin'
    is_prod_mutating: false

  - id: merge-dev
    kind: shell
    command_or_prompt: 'git merge --ff-only origin/dev'
    is_prod_mutating: false

  - id: install-deps
    kind: shell
    command_or_prompt: 'npm ci'
    is_prod_mutating: false

  - id: build
    kind: shell
    command_or_prompt: 'npm run build'
    is_prod_mutating: false

  - id: sync-runtime
    kind: shell
    command_or_prompt: 'rsync -a --delete --exclude=''.git/'' --exclude=''.claude/'' --exclude=''*.db'' --exclude=''*.db-wal'' --exclude=''*.db-shm'' --exclude=''.env'' ./ "$RUNTIME_DIR/"'
    is_prod_mutating: true

  - id: confirm-restart
    kind: confirm-gate
    command_or_prompt: 'operator approval to restart orchestrator.service now that the synced build is in place'
    is_prod_mutating: false

  - id: restart
    kind: shell
    command_or_prompt: 'sudo systemctl restart orchestrator.service'
    identity_capture: 'curl -sf http://localhost:3000/api/deploy/build-sha'
    is_prod_mutating: true

  - id: verify
    kind: validation
    command_or_prompt: 'systemctl is-active --quiet orchestrator.service && curl -sf -o /dev/null http://localhost:3000/'
    is_prod_mutating: false
    poll_until: 'systemctl is-active --quiet orchestrator.service && curl -sf -o /dev/null http://localhost:3000/'

  - id: report-in
    kind: report-in
    is_prod_mutating: false

  - id: record-deployed-sha
    kind: shell
    command_or_prompt: 'git rev-parse HEAD > "$DEPLOYED_SHA_PATH"'
    # A post-success bookkeeping write (runs after verify already passed),
    # not a production mutation — a failure here means "the deploy
    # succeeded, but re-write the marker," never a rollback candidate.
    is_prod_mutating: false

hazards:
  - 'never sync or restart before build succeeds — a partial build must never reach the runtime directory'
  - 'never overwrite .env, *.db*, .git, or .claude in the runtime directory during sync'
  - 'never merge anything other than a fast-forward from origin/dev — a non-ff merge means the runtime is out of sync with dev and must be investigated before deploying'
  - 'never restart without a successful sync immediately before it'

failure_diagnoses:
  - symptom: 'merge --ff-only fails'
    cause: 'the runtime checkout has diverged from origin/dev (local commits or a prior non-ff state)'
    action: 'stop and investigate the divergence before forcing any merge — do not force-push or reset the runtime checkout'
    step: merge-dev

  - symptom: 'npm ci fails'
    cause: 'a lockfile/registry mismatch or a stale node_modules incompatible with the new lockfile'
    action: 'inspect the npm ci error output; do not fall back to npm install as a substitute without operator confirmation'
    step: install-deps

  - symptom: 'npm run build fails'
    cause: 'a type error or build-time failure introduced by the merged changes'
    action: 'stop the deploy — do not sync a failed build into the runtime directory'
    step: build

  - symptom: 'rsync to the runtime directory fails'
    cause: 'a permissions issue, disk-space exhaustion, or an interrupted transfer on the runtime host'
    action: 'inspect the rsync error output and the runtime directory state before retrying — do not restart against a partially synced tree'
    step: sync-runtime

  - symptom: 'the restart command itself fails or the service does not come back'
    cause: 'the synced build is broken at process start, or the systemd unit failed to restart'
    action: 'inspect `journalctl -u orchestrator.service` for the crash; this repo runs forward-only DB migrations on boot, so a blind re-sync-and-restart of the prior build can leave the schema ahead of the reverted code — diagnose before choosing a path back'
    step: restart

  - symptom: 'service fails health checks after restart'
    cause: 'the new build is broken at runtime, or the restart did not pick up the synced files'
    action: 'inspect `journalctl -u orchestrator.service` and the health endpoint response; this repo runs forward-only DB migrations on boot, so a blind re-sync-and-restart of the prior build can leave the schema ahead of the reverted code — diagnose before choosing a path back'
    step: verify

  - symptom: 'record-deployed-sha fails to write the marker'
    cause: 'a filesystem permissions or disk-space issue on the marker path'
    action: 'the deploy otherwise succeeded (verify already passed) — just re-write the marker file at the DEPLOYED_SHA_PATH binding (see config/projects/claude-orchestrator/deploy-bindings.yml) with the deployed commit SHA'
    step: record-deployed-sha

companions: []
